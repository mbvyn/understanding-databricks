# This is a Declarative Automation Bundle definition for understanding_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: understanding_databricks
  uuid: 7db1e329-d9e0-4d61-aaa8-8681173dccda

include:
  - resources/*.yml
  # Local, git-ignored overrides (e.g. your workspace host). See databricks.local.yml.example.
  - databricks.local.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    # No hardcoded host here: set it in your local databricks.local.yml (git-ignored).
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      # We explicitly deploy to the deploying user's folder to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
